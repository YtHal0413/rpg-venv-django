{% load static %}
<!-- Bloco: navegação principal, atalhos de conta e indicação da página atual. -->
<header class="w-full max-w-7xl mx-auto px-4 pt-6 relative z-30">
    {% include 'partials/flash.html' %}
    <nav class="ui-surface ui-border rounded-2xl border px-6 py-4 flex items-center justify-between backdrop-blur-md">
        <div class="flex items-center gap-8">
            <a href="{% url 'inicio' %}" class="flex items-center" aria-label="Página inicial">
                <img class="w-8 h-8" src="{% static 'images/logo.png' %}" alt="RPG.Venv">
            </a>
            <div class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="{% url 'inicio' %}" class="nav-link{% if pagina_ativa == 'inicio' %} nav-link-ativo{% endif %}">Início</a>
                <a href="{% url 'livros' %}" class="nav-link{% if pagina_ativa == 'arquivos' %} nav-link-ativo{% endif %}">Arquivos</a>
                <a href="{% url 'colecoes' %}" class="nav-link{% if pagina_ativa == 'colecoes' %} nav-link-ativo{% endif %}">Coleções</a>
            </div>
        </div>

        {% if user.is_authenticated %}
            <div class="flex items-center gap-3">
                {% include 'partials/botao_loja_chaves.html' %}
                <a href="{% url 'perfil' %}" class="ui-border w-8 h-8 rounded-full border-2 overflow-hidden hover:opacity-80 transition block" aria-label="Abrir perfil">
                    {% if user.avatar %}
                        <img src="{% url 'avatar_proprio' %}" alt="Avatar de {{ user.username }}" class="w-full h-full object-cover">
                    {% else %}
                        <span class="ui-component ui-text-heading w-full h-full flex items-center justify-center font-bold">{{ user.username|first|upper }}</span>
                    {% endif %}
                </a>
            </div>
        {% else %}
            <a href="{% url 'login' %}" class="nav-link font-bold">Entrar</a>
        {% endif %}
    </nav>
</header>
