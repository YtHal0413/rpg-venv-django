{% load static %}
<!-- Bloco: mensagens de retorno com fechamento manual e automático. -->
{% if messages %}
    <div id="flash-container" class="fixed top-20 right-4 z-50 flex flex-col gap-3 max-w-sm w-full">
        {% for message in messages %}
            <div
                class="flash-message relative ui-surface border rounded-xl p-4 backdrop-blur-md shadow-2xl overflow-hidden
                {% if message.tags == 'success' %}ui-border-positive{% elif message.tags == 'error' %}ui-border-danger{% elif message.tags == 'warning' %}ui-border-accent{% else %}ui-border-accent{% endif %}"
                data-duration="3000"
            >
                <div
                    class="absolute bottom-0 left-0 h-1 bg-gradient-to-r
                    {% if message.tags == 'success' %}ui-gradient-positive{% elif message.tags == 'error' %}ui-gradient-danger{% else %}ui-gradient-accent{% endif %}"
                    style="width: 100%; animation: progressBar 3s linear forwards;"
                ></div>
                <div class="flex items-start space-x-3 relative z-10">
                    <p class="flex-1 min-w-0 text-sm font-medium text-white" role="status">{{ message }}</p>
                    <button
                        type="button"
                        onclick="fecharFlash(this)"
                        class="flex-shrink-0 ui-text-muted ui-hover-heading transition ml-2"
                        aria-label="Fechar mensagem"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        {% endfor %}
    </div>
{% endif %}

<script defer src="{% static 'js/flash.js' %}"></script>
