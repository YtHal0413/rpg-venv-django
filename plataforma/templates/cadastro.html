<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal RPG - Criar conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
</head>
<body class="text-white min-h-screen flex flex-col justify-between relative overflow-x-hidden">
    <div class="ondas-background">
        <div class="onda onda-1"></div>
        <div class="onda onda-2"></div>
        <div class="onda onda-3"></div>
    </div>
    <header class="w-full max-w-7xl mx-auto px-4 pt-6">
        <nav class="bg-purple-950/60 border border-white/10 rounded-2xl px-6 py-4">
            <a href="{{ url_for('inicio') }}" class="text-sm font-bold text-purple-200 hover:text-white">Voltar ao início</a>
        </nav>
    </header>
    <main class="flex-grow flex items-center justify-center px-4 py-12 z-10">
        <div class="w-full max-w-md">
            {% include 'partials/flash.html' %}
            <div class="bg-purple-950/40 border border-white/10 rounded-3xl p-8 sm:p-10 backdrop-blur-md shadow-2xl">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-black tracking-tight mb-2">Criar conta</h1>
                    <p class="text-purple-200/70 text-sm">Cadastre-se para criar e organizar suas fichas.</p>
                </div>
                <form action="{{ url_for('cadastro') }}" method="POST" class="space-y-5">
                    {{ csrf_input }}
                    <div>
                        <label for="nome" class="block text-xs font-semibold text-purple-200 uppercase tracking-wider mb-2">Nome</label>
                        <input type="text" id="nome" name="nome" required maxlength="100" autocomplete="name" class="w-full bg-purple-950/60 border border-white/10 focus:border-violet-400 rounded-xl px-4 py-3 text-white outline-none">
                    </div>
                    <div>
                        <label for="email" class="block text-xs font-semibold text-purple-200 uppercase tracking-wider mb-2">E-mail</label>
                        <input type="email" id="email" name="email" required autocomplete="email" class="w-full bg-purple-950/60 border border-white/10 focus:border-violet-400 rounded-xl px-4 py-3 text-white outline-none">
                    </div>
                    <div>
                        <label for="senha" class="block text-xs font-semibold text-purple-200 uppercase tracking-wider mb-2">Senha</label>
                        <input type="password" id="senha" name="senha" required autocomplete="new-password" class="w-full bg-purple-950/60 border border-white/10 focus:border-violet-400 rounded-xl px-4 py-3 text-white outline-none">
                    </div>
                    <div>
                        <label for="confirmar_senha" class="block text-xs font-semibold text-purple-200 uppercase tracking-wider mb-2">Confirme a senha</label>
                        <input type="password" id="confirmar_senha" name="confirmar_senha" required autocomplete="new-password" class="w-full bg-purple-950/60 border border-white/10 focus:border-violet-400 rounded-xl px-4 py-3 text-white outline-none">
                    </div>
                    <button type="submit" class="w-full bg-violet-400 hover:bg-violet-500 text-purple-950 font-black py-4 rounded-xl text-sm tracking-wide transition">CRIAR CONTA</button>
                </form>
                <p class="mt-6 text-center text-sm text-purple-200">Já possui cadastro? <a href="{{ url_for('login') }}" class="font-bold text-violet-300 hover:text-white">Entrar</a>.</p>
            </div>
        </div>
    </main>
    <footer class="w-full text-center py-6 text-xs text-purple-400/60">&copy; 2026 Universal RPG.</footer>
</body>
</html>
